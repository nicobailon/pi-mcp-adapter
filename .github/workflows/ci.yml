name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build interactive visualizer example
        run: |
          npm install --prefix examples/interactive-visualizer --no-package-lock --no-audit --no-fund
          npm run --prefix examples/interactive-visualizer build
      - name: Typecheck
        run: npm run typecheck
      - run: npm test
      - run: npm run test:oauth
      - run: npm run test:conformance
      - run: npm pack --dry-run

  oauth-coordination:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PI_MCP_ADAPTER_TEST_AUTH_STORE: memory
      PI_MCP_ADAPTER_DISABLE_AUTH_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test mcp-refresh-lock.test.ts mcp-oauth-provider.test.ts
      - run: npx vitest run __tests__/oauth-transaction-processes.test.ts __tests__/oauth-fetch-transaction.test.ts __tests__/oauth-diagnostics.test.ts __tests__/oauth-storage-transaction.test.ts

  node24-worker-fds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test -- --run __tests__/mcp-code.test.ts
